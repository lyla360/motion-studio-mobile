name: Build & Release Android APK (Capacitor)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: |
          npm install --no-audit

      - name: Sync Capacitor Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Android Permissions & Hardware Acceleration
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"/g' "$MANIFEST" || true
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Rename APK
        run: |
          mkdir -p build-artifacts
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-artifacts/MotionStudio-Release-v1.0.apk \;
          ls -lh build-artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotionStudio-Android-APK
          path: build-artifacts/*.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          files: build-artifacts/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: "Motion Studio App ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
